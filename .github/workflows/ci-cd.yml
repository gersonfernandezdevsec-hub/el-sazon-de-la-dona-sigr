name: CI-CD El Sazón de la Doña

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas automatizadas (59 casos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas en Chrome sin interfaz
        env:
          CHROME_BIN: google-chrome
        run: python probar.py

  seguridad:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  despliegue:
    name: Despliegue a entorno de pruebas (GitHub Pages)
    needs: [pruebas, seguridad]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar solo lo publicable
        run: |
          mkdir dist
          cp -r index.html css js img dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: despliegue
        uses: actions/deploy-pages@v4
